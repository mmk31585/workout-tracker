      $ref: "../collections/Workout Tracker API/Debug/Statsviz WebSocket.request.yaml"
  - request:
      $ref: "../collections/Workout Tracker API/Auth/Signup.request.yaml"
  - request:
      $ref: "../collections/Workout Tracker API/Auth/Login.request.yaml"
  - request:
      $ref: "../collections/Workout Tracker API/Auth/Logout.request.yaml"
