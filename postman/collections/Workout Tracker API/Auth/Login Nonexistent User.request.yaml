$kind: http-request
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
        "email": "nonexistent@example.com",
        "password": "TestPassword123"
    }
scripts:
  - type: afterResponse
    code: |-
      // Login with nonexistent user test
      pm.test("Login with nonexistent user returns 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.withJson;
      });

      pm.test("Response contains error envelope", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('data', null);
          pm.expect(jsonData).to.have.property('error');
      });
    language: text/javascript
order: 2020