$kind: http-request
url: "{{base_url}}/api/v1/workout-plans"
method: GET
headers:
  Content-Type: application/json
  Accept: application/json
  Authorization: Bearer {{access_token}}
scripts:
  - type: afterResponse
    code: |-
      // List Workout Plans request tests
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has valid JSON", function () {
          pm.response.to.be.withJson;
      });

      pm.test("Response contains data envelope", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('data');
      });

      pm.test("Data is an array", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data).to.be.an('array');
      });

      pm.test("Array contains at least one plan", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data).to.have.lengthOf.at.least(1);
      });

      pm.test("First item has required fields", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data[0]).to.have.property('id');
          pm.expect(jsonData.data[0]).to.have.property('title');
          pm.expect(jsonData.data[0]).to.have.property('items');
      });
language: text/javascript
order: 1000
