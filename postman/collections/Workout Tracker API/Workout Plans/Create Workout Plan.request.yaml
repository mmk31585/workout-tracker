$kind: http-request
url: "{{base_url}}/api/v1/workout-plans"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
  Authorization: Bearer {{access_token}}
body:
  type: text
  content: |-
    {
        "title": "Push Day",
        "description": "Chest and triceps workout",
        "items": [
            {
                "exercise_id": "123e4567-e89b-12d3-a456-426614174000",
                "order_index": 0,
                "sets": 3,
                "reps": 10,
                "weight": 50.0,
                "unit": "kg"
            },
            {
                "exercise_id": "123e4567-e89b-12d3-a456-426614174001",
                "order_index": 1,
                "sets": 4,
                "reps": 8,
                "weight": 60.0,
                "unit": "kg"
            }
        ]
    }
scripts:
  - type: beforeRequest
    code: |-
      // Generate test UUIDs if needed
      if (!pm.environment.has("test_exercise_id_1")) {
          const crypto = require('crypto');
          pm.environment.set("test_exercise_id_1", "123e4567-e89b-12d3-a456-426614174000");
          pm.environment.set("test_exercise_id_2", "123e4567-e89b-12d3-a456-426614174001");
      }
  - type: afterResponse
    code: |-
      // Create Workout Plan request tests
      pm.test("Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response has valid JSON", function () {
          pm.response.to.be.withJson;
      });

      pm.test("Response contains data envelope", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('data');
      });

      pm.test("Data contains plan ID", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data).to.have.property('id');
          pm.expect(jsonData.data.id).to.be.a('string').and.not.empty;
          pm.environment.set("test_plan_id", jsonData.data.id);
      });

      pm.test("Data contains title", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data).to.have.property('title', 'Push Day');
      });

      pm.test("Data contains description", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data).to.have.property('description', 'Chest and triceps workout');
      });

      pm.test("Data contains items array", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data).to.have.property('items');
          pm.expect(jsonData.data.items).to.be.an('array').that.has.lengthOf(2);
      });

      pm.test("First item has correct exercise", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data.items[0]).to.have.property('exercise_id', '123e4567-e89b-12d3-a456-426614174000');
      });

      pm.test("Second item has correct exercise", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data.items[1]).to.have.property('exercise_id', '123e4567-e89b-12d3-a456-426614174001');
      });
language: text/javascript
order: 1000
